[project]
name = "pdf-extraction"
version = "1.3.1"
description = "Microservicio de extraccion de texto de PDF (contrato microservicios-pdf v1.0.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
